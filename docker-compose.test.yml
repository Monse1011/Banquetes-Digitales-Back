# PostgreSQL desechable para las pruebas de integración.
# Credenciales en .env (TEST_PGUSER, TEST_PGPASSWORD, TEST_PGDATABASE, TEST_PGPORT).
#   docker compose -f docker-compose.test.yml up -d --wait
# schema.sql solo se ejecuta al crear el volumen; para recrear la BD desde cero:
#   docker compose -f docker-compose.test.yml down -v
name: banquetes-test

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${TEST_PGUSER:?Define TEST_PGUSER en .env}
      POSTGRES_PASSWORD: ${TEST_PGPASSWORD:?Define TEST_PGPASSWORD en .env}
      POSTGRES_DB: ${TEST_PGDATABASE:?Define TEST_PGDATABASE en .env}
    ports:
      - "127.0.0.1:${TEST_PGPORT:-55432}:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
